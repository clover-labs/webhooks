<script>try { const t = localStorage.getItem("brief:theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Clover Labs tokens, from cloverlabs.io/styles/main.css (the site has no dark mode; dark values derived from --ink). */
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #69727d; --line: #e6e6e6; --card: #ffffff;
    --accent: #4ead43; --accent-hover: #3c8f33; --accent-soft: #4ead431f; --danger: #c2410c;
    --font-head: "Poppins", Helvetica, Arial, sans-serif; --font-body: "Roboto", Helvetica, Arial, sans-serif; --radius: 6px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #121512; --fg: #f0f0f0; --muted: #9aa39b; --line: #2b322c; --card: #1a1f1a; --accent-hover: #5fc053; --accent-soft: #4ead432e; --danger: #fb923c; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #121512; --fg: #f0f0f0; --muted: #9aa39b; --line: #2b322c; --card: #1a1f1a; --accent-hover: #5fc053; --accent-soft: #4ead432e; --danger: #fb923c; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 17px/1.55 var(--font-body); transition: background .2s, color .2s; -webkit-font-smoothing: antialiased; }
  .progress { position: fixed; inset: 0 0 auto; height: 4px; background: var(--line); z-index: 2; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .35s ease; }
  header { position: fixed; top: 4px; left: 0; right: 0; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--muted); background: var(--bg); z-index: 1; }
  .logo { display: flex; align-items: center; gap: 8px; font: 600 18px var(--font-head); color: var(--fg); text-decoration: none; }
  .logo img { width: 26px; height: 26px; }
  .right { display: flex; align-items: center; gap: 14px; }
  .theme { font: inherit; width: 34px; height: 34px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); color: var(--fg); cursor: pointer; display: grid; place-items: center; }
  .theme:hover { border-color: var(--accent); }
  main { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 96px 16px 120px; }
  .screen { width: 100%; max-width: 640px; animation: in .35s ease both; }
  .screen.back { animation-name: in-back; }
  @keyframes in { from { opacity: 0; transform: translateY(24px); } }
  @keyframes in-back { from { opacity: 0; transform: translateY(-24px); } }
  .section { font-size: 14px; color: var(--accent); font-weight: 600; margin-bottom: 10px; }
  .section span { color: var(--muted); font-weight: 400; }
  h1 { font-family: var(--font-head); font-size: clamp(26px, 5vw, 36px); line-height: 1.2; font-weight: 600; margin: 0 0 12px; letter-spacing: -.01em; }
  h2 { font-family: var(--font-head); font-size: clamp(21px, 4.2vw, 27px); line-height: 1.3; font-weight: 500; margin: 0 0 8px; }
  .help { color: var(--muted); margin: 0 0 20px; }
  .req { color: var(--accent); }
  input[type=text], input[type=url], textarea {
    width: 100%; border: 0; border-bottom: 2px solid var(--line); background: transparent; color: var(--fg);
    font: inherit; font-size: 22px; padding: 8px 0; outline: none; resize: none; margin-top: 12px;
  }
  input:focus, textarea:focus { border-color: var(--accent); }
  textarea { min-height: 3.2em; }
  .options { display: grid; gap: 10px; margin-top: 16px; max-width: 460px; }
  .opt {
    display: flex; align-items: center; gap: 12px; text-align: left; font: inherit; color: var(--fg);
    background: var(--card); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 12px 14px; cursor: pointer;
  }
  .opt:hover { border-color: var(--accent); }
  .opt.on { border-color: var(--accent); background: var(--accent-soft); }
  .key { flex: none; width: 24px; height: 24px; border: 1.5px solid var(--line); border-radius: 5px; display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--muted); }
  .opt.on .key { background: var(--accent); border-color: var(--accent); color: #fff; }
  .actions { display: flex; align-items: center; gap: 14px; margin-top: 28px; }
  .btn { font: 500 16px var(--font-head); border: 0; border-radius: var(--radius); padding: 11px 20px; background: var(--accent); color: #fff; cursor: pointer; }
  .btn:hover:not(:disabled) { background: var(--accent-hover); }
  .btn:disabled { opacity: .5; cursor: default; }
  .hint { font-size: 13px; color: var(--muted); }
  .error { color: var(--danger); font-size: 14px; margin-top: 12px; min-height: 1.4em; }
  nav { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 2px; }
  nav button { font: inherit; width: 44px; height: 40px; border: 0; background: var(--accent); color: #fff; cursor: pointer; font-size: 18px; }
  nav button:hover:not(:disabled) { background: var(--accent-hover); }
  nav button:first-child { border-radius: var(--radius) 0 0 var(--radius); }
  nav button:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
  nav button:disabled { opacity: .35; cursor: default; }
  .review { margin: 20px 0 0; padding: 0; list-style: none; }
  .review h3 { font-size: 14px; color: var(--accent); margin: 22px 0 6px; }
  .review button { display: block; width: 100%; text-align: left; font: inherit; color: var(--fg); background: none; border: 0; border-bottom: 1px solid var(--line); padding: 10px 0; cursor: pointer; }
  .review button:hover .q { color: var(--accent); }
  .review .q { font-size: 14px; color: var(--muted); display: block; }
  .review .a { white-space: pre-wrap; }
  .review .a.empty { color: var(--muted); font-style: italic; }
  .hp { position: absolute; left: -9999px; }
  @media (max-width: 520px) { body { font-size: 16px; } input[type=text], input[type=url], textarea { font-size: 19px; } .hint { display: none; } }
</style>

<script type="application/json" id="config">__CONFIG__</script>
<script>
(() => {
  const brief = JSON.parse(document.getElementById("config").textContent);
  const KEY = "brief:" + brief.slug;
  const LETTERS = "ABCDEFGHIJ";

  // Screens: welcome → one per field → review → done
  const fields = [];
  brief.sections.forEach((s, si) => s.fields.forEach((f) => fields.push({ ...f, section: s.title, si })));
  const screens = [{ kind: "welcome" }, ...fields.map((f) => ({ kind: "field", f })), { kind: "review" }, { kind: "done" }];
  const REVIEW = screens.length - 2;

  // `sent` is kept after sending so people can come back, change something and send an update.
  let answers = {}, index = 0, sent = false, fromReview = false;
  try { const saved = JSON.parse(localStorage.getItem(KEY)); if (saved) ({ answers, index, sent = false } = saved); } catch {}
  if (!(index >= 0 && index <= (sent ? REVIEW + 1 : REVIEW))) index = 0;
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ answers, index, sent })); } catch {} };

  const $main = document.getElementById("main");
  const $prev = document.getElementById("prev");
  const $next = document.getElementById("next");
  const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };
  const empty = (a) => a === undefined || (Array.isArray(a) ? a.length === 0 : String(a).trim() === "");

  function go(to, dir = to > index ? 1 : -1) {
    if (to < 0 || to > REVIEW) return;
    index = to; save(); render(dir);
  }

  function next() {
    const s = screens[index];
    if (s.kind === "field" && s.f.required && empty(answers[s.f.id])) return showError("Please fill this in.");
    if (fromReview) { fromReview = false; return go(REVIEW); }
    go(index + 1);
  }

  function showError(msg) { const e = $main.querySelector(".error"); if (e) e.textContent = msg; }

  function render(dir = 1) {
    const s = screens[index];
    const node = el("div", { className: "screen" + (dir < 0 ? " back" : "") });
    ({ welcome, field, review, done })[s.kind](node, s);
    $main.replaceChildren(node);

    const pos = s.kind === "field" ? fields.indexOf(s.f) + 1 : s.kind === "welcome" ? 0 : fields.length;
    document.getElementById("bar").style.width = (pos / fields.length) * 100 + "%";
    document.getElementById("count").textContent = s.kind === "field" ? `${pos} of ${fields.length}` : "";
    $prev.disabled = index === 0 || s.kind === "done";
    $next.disabled = index >= REVIEW;
    node.querySelector("input, textarea")?.focus({ preventScroll: true });
  }

  function welcome(node) {
    node.append(
      el("div", { className: "section", textContent: brief.company }),
      el("h1", { textContent: brief.title }),
      el("p", { className: "help", textContent: brief.intro }),
      el("div", { className: "actions" }, el("button", { className: "btn", textContent: Object.keys(answers).length ? "Continue" : "Start", onclick: next }), el("span", { className: "hint", textContent: "press Enter ↵" })),
    );
  }

  function field(node, { f }) {
    const n = brief.sections.length;
    node.append(
      el("div", { className: "section" }, `${f.si + 1} · ${f.section} `, el("span", { textContent: `(section ${f.si + 1} of ${n})` })),
      el("h2", {}, f.label, ...(f.required ? [el("span", { className: "req", textContent: " *" })] : [])),
    );
    if (f.help) node.append(el("p", { className: "help", textContent: f.help }));

    if (f.type === "single" || f.type === "multi") {
      const opts = el("div", { className: "options" });
      f.options.forEach((o, i) => {
        const on = f.type === "single" ? answers[f.id] === o : (answers[f.id] || []).includes(o);
        opts.append(el("button", { className: "opt" + (on ? " on" : ""), onclick: () => pick(f, o) }, el("span", { className: "key", textContent: LETTERS[i] }), o));
      });
      node.append(opts);
    } else {
      const input = f.type === "long"
        ? el("textarea", { rows: 3, placeholder: "Type your answer here…" })
        : el("input", { type: f.type === "url" ? "url" : "text", placeholder: f.placeholder || "Type your answer here…" });
      input.value = answers[f.id] || "";
      input.oninput = () => {
        answers[f.id] = input.value; save();
        if (input.tagName === "TEXTAREA") { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; }
      };
      node.append(input);
    }

    const hint = f.type === "long" ? "Shift + Enter for a new line" : f.type === "single" ? "or press a letter" : f.type === "multi" ? "choose as many as you like" : "press Enter ↵";
    node.append(
      el("div", { className: "actions" }, el("button", { className: "btn", textContent: fromReview ? "Back to review" : "OK", onclick: next }), el("span", { className: "hint", textContent: hint })),
      el("div", { className: "error" }),
    );
  }

  function pick(f, o) {
    if (f.type === "single") {
      answers[f.id] = answers[f.id] === o ? undefined : o; save(); render(0);
      if (answers[f.id]) setTimeout(next, 280);
    } else {
      const cur = answers[f.id] || [];
      answers[f.id] = cur.includes(o) ? cur.filter((x) => x !== o) : [...cur, o]; save(); render(0);
    }
  }

  function review(node) {
    const list = el("div", { className: "review" });
    brief.sections.forEach((s, si) => {
      list.append(el("h3", { textContent: `${si + 1} · ${s.title}` }));
      s.fields.forEach((f) => {
        const a = answers[f.id];
        const text = empty(a) ? "Skipped" : Array.isArray(a) ? a.join(", ") : a;
        list.append(el("button", { onclick: () => { fromReview = true; go(screens.findIndex((x) => x.f === fields.find((y) => y.id === f.id)), -1); } },
          el("span", { className: "q", textContent: f.label }), el("span", { className: "a" + (empty(a) ? " empty" : ""), textContent: text })));
      });
    });
    const label = sent ? "Send update" : "Send answers";
    const btn = el("button", { className: "btn", textContent: label, onclick: () => send(btn, label) });
    node.append(
      el("h1", { textContent: "Check your answers" }),
      el("p", { className: "help", textContent: sent ? "You've sent these already. Change what you need, then send the update." : "Click any answer to change it." }),
      list,
      el("div", { className: "actions" }, btn),
      el("div", { className: "error" }),
    );
  }

  async function send(btn, label) {
    btn.disabled = true; btn.textContent = "Sending…";
    try {
      const res = await fetch(location.pathname, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ answers, update: sent, website: document.getElementById("website").value }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok || !body.ok) throw new Error(body.error || res.status);
      sent = true; index = REVIEW + 1; save(); render(1);
    } catch (e) {
      btn.disabled = false; btn.textContent = label;
      showError("Something went wrong, please try again. Your answers are saved on this device.");
    }
  }

  function done(node) {
    node.append(
      el("h1", { textContent: "Thank you" + (answers.name ? ", " + String(answers.name).split(" ")[0] : "") + "." }),
      el("p", { className: "help", textContent: "We've got your answers. We'll go through them and come back to you with a plan." }),
      el("div", { className: "actions" }, el("button", { className: "btn", textContent: "Change something", onclick: () => go(REVIEW, -1) })),
    );
  }

  // Theme: follows the system until the viewer picks one, then remembered on this device.
  const $theme = document.getElementById("theme");
  const isDark = () => (document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";
  const paintToggle = () => { $theme.textContent = isDark() ? "☀" : "☾"; };
  $theme.onclick = () => {
    const t = isDark() ? "light" : "dark";
    document.documentElement.dataset.theme = t; paintToggle();
    try { localStorage.setItem("brief:theme", t); } catch {}
  };
  paintToggle();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintToggle);

  $prev.onclick = () => { fromReview = false; go(index - 1, -1); };
  $next.onclick = next;

  document.addEventListener("keydown", (e) => {
    const s = screens[index];
    const t = e.target;
    if (e.key === "Enter" && !(t.tagName === "TEXTAREA" && e.shiftKey) && !(t.tagName === "BUTTON")) {
      if (s.kind === "review" || s.kind === "done") return;
      e.preventDefault(); return next();
    }
    // Arrows move between questions, except inside a textarea where they move the cursor.
    if ((e.key === "ArrowUp" || e.key === "ArrowDown") && t.tagName !== "TEXTAREA" && s.kind !== "done") {
      e.preventDefault();
      if (e.key === "ArrowUp") { fromReview = false; return go(index - 1, -1); }
      return next();
    }
    if (s.kind === "field" && s.f.options && !/INPUT|TEXTAREA/.test(t.tagName) && !e.metaKey && !e.ctrlKey) {
      const i = LETTERS.indexOf(e.key.toUpperCase());
      if (i >= 0 && i < s.f.options.length) pick(s.f, s.f.options[i]);
    }
  });

  render();
})();
</script>
</body>
</html>
